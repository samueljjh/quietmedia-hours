<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiet Media Hours</title>
<meta name="description" content="Hours, bookings and invoicing for Quiet Media.">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QM Hours">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap">
<style>
/* Layout: studio logbook — header with live clocks, one working view at a time, sharp edges, warm neutrals, client colours as the only chroma */
:root{
  --bg:#0A0A0A; --surface:#111111; --raise:#181715; --fg:#FFFFFF; --muted:#9A918A;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.18); --line-rgb:255,255,255;
  --tan:#8A7F76; --sand:#DDD5C3; --cream:#EDECE8;
  --live:#DDD5C3; --warn:#C9894E; --ok:#A7B3A0; --danger:#C46A5A;
  --font:'DM Sans','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F5F4F2; --surface:#EEECEA; --raise:#E6E3DF; --fg:#0A0A0A; --muted:#6E655E;
  --line:rgba(10,10,10,.09); --line-strong:rgba(10,10,10,.22); --line-rgb:10,10,10;
  --tan:#7A6F66; --sand:#8A7F76; --cream:#0A0A0A; --live:#5E544C; --warn:#A8662C; --ok:#5F6E58; --danger:#A64838;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F4F2; --surface:#EEECEA; --raise:#E6E3DF; --fg:#0A0A0A; --muted:#6E655E;
  --line:rgba(10,10,10,.09); --line-strong:rgba(10,10,10,.22); --line-rgb:10,10,10;
  --tan:#7A6F66; --sand:#8A7F76; --cream:#0A0A0A; --live:#5E544C; --warn:#A8662C; --ok:#5F6E58; --danger:#A64838;
  color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-weight:300;font-size:15px;line-height:1.55;color:var(--fg);-webkit-font-smoothing:antialiased;padding-inline:16px}
body::after{content:'';position:fixed;inset:0;z-index:1000;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.035'/%3E%3C/svg%3E");background-size:200px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 110px}
h1,h2,h3{font-weight:300;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,46px);letter-spacing:-.8px;line-height:1.05}
h2{font-size:26px;letter-spacing:-.4px;line-height:1.15}
h3{font-size:19px;letter-spacing:-.1px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--tan)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:var(--font);font-size:15px;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--sand);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);margin-right:auto}
.brand svg{width:26px;height:26px}
.brand b{font-weight:300;font-size:19px;letter-spacing:-.2px}
.brand span{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--tan);padding-left:10px;border-left:1px solid var(--line-strong)}
.seg{display:inline-flex;border:1px solid var(--line-strong)}
.seg button{background:none;border:0;padding:8px 14px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.iconbtn{background:none;border:1px solid var(--line-strong);width:36px;height:36px;display:grid;place-items:center;color:var(--fg)}
.iconbtn svg{width:16px;height:16px}

nav.tabs{display:flex;gap:4px;margin:14px 0 26px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:1px solid transparent;padding:8px 12px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
nav.tabs svg{display:none}
.livebar{display:none}
@media (max-width:720px){
  .wrap{padding-block:12px 120px}
  .top{padding-bottom:12px;gap:10px}
  .brand b{font-size:17px}.brand span{display:none}
  .seg button{padding:9px 12px}
  h1{font-size:28px;letter-spacing:-.5px}
  .stat .v{font-size:24px}
  .panel{padding:16px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
  nav.tabs button{flex:1;display:grid;justify-items:center;gap:4px;padding:6px 2px;font-size:9px;letter-spacing:.06em;border:0}
  nav.tabs svg{display:block;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.3}
  nav.tabs button[aria-current="page"]{color:var(--fg)}
  nav.tabs .t-settings{display:none}
  .livebar.on{display:flex;position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:49;background:var(--fg);color:var(--bg);align-items:center;gap:12px;padding:10px 16px;font-size:13px}
  .livebar .lt{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .livebar .lt b{font-weight:500;font-variant-numeric:tabular-nums;margin-right:8px}
  .livebar button{background:var(--bg);color:var(--fg);border:0;padding:8px 14px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .livebar .ldot{width:8px;height:8px;background:var(--bg);flex:none;animation:p 1.6s ease-in-out infinite}
  .btn{padding:14px 20px;font-size:13px}
  .btn.small{padding:10px 14px}
  .item{padding:13px 0}
  .modal{padding:20px;max-height:calc(100% - 16px)}
}
@media (pointer:coarse){
  .btn,.seg button,.link,.iconbtn,.swatches button{min-height:44px}
  .swatches button{min-width:44px}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{min-height:46px;font-size:16px}
}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line-strong);padding:9px 12px;font-size:13px;color:var(--fg);max-width:100%}
.quick button span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick button:hover{border-color:var(--fg)}
.fade{animation:f .35s var(--ease)}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* banners */
.banner{border:1px solid var(--line-strong);padding:10px 14px;font-size:13px;margin-bottom:20px;color:var(--muted)}
.banner.warn{border-color:var(--warn);color:var(--fg)}

/* generic */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);padding:20px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;background:var(--fg);color:var(--bg);border:0;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:opacity .2s var(--ease)}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-strong)}
.btn.small{padding:7px 12px;font-size:11px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--sand);font-size:13px;text-decoration:underline;text-underline-offset:3px}
label.f{display:grid;gap:6px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--tan);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line-strong);padding:10px 12px;border-radius:0;font-weight:300;text-transform:none;letter-spacing:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sand)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 150px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.dot{width:10px;height:10px;flex:none;display:inline-block}
.pill{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line-strong);color:var(--muted)}
.pill.draft{color:var(--muted)}
.pill.sent{color:var(--warn);border-color:var(--warn)}
.pill.paid{color:var(--ok);border-color:var(--ok)}
.pill.live{color:var(--bg);background:var(--live);border-color:var(--live)}
.empty{padding:22px 0;color:var(--muted);font-size:14px}
.empty b{color:var(--fg);font-weight:400}

/* clock cards */
.clock{display:grid;gap:16px}
.clock .who{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock .big{font-size:clamp(40px,6vw,58px);letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.clock.running{border-color:var(--line-strong)}
.pulse{width:8px;height:8px;background:var(--live);display:inline-block;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .sw{width:4px;align-self:stretch;min-height:28px}
.item .main{min-width:0}
.item .main .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--muted)}
.item .end{text-align:right;font-variant-numeric:tabular-nums;display:grid;justify-items:end;gap:4px}
.item .acts{display:flex;gap:10px}

/* stats */
.stat{display:grid;gap:4px}
.stat .v{font-size:30px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s{font-size:12px;color:var(--muted)}

/* bars */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;font-size:13px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--line);position:relative;display:flex}
.bar .track i{display:block;height:100%}
.bar .val{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
.goal{height:6px;background:var(--line);position:relative;margin-top:10px}
.goal i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.goal u{position:absolute;inset:0 auto 0 0;background:var(--tan);text-decoration:none}

/* client cards */
.ccard{background:var(--surface);border:1px solid var(--line);padding:18px;text-align:left;display:grid;gap:14px;color:var(--fg);transition:border-color .2s}
.ccard:hover{border-color:var(--line-strong)}
.ccard .hd{display:flex;align-items:center;gap:10px}
.ccard .hd .sq{width:14px;height:14px}
.ccard .hd h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .figs{display:flex;gap:22px;flex-wrap:wrap}
.ccard .figs div{display:grid}
.ccard .figs b{font-weight:300;font-size:22px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.ccard .figs span{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--tan)}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--tan);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line-strong)}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
td.r,th.r{text-align:right;padding-right:0}
tfoot td{border-bottom:0;font-weight:400}

/* schedule */
.day{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:96px 1fr;gap:14px}
.day .dl{font-size:12px}
.day .dl b{display:block;font-size:22px;font-weight:300;letter-spacing:-.3px;line-height:1.1}
.day.today .dl b{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.ev{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:8px 0}
.ev+.ev{border-top:1px dashed var(--line)}
.ev .main{min-width:0}
@media (max-width:520px){.day{grid-template-columns:1fr}.day .dl b{display:inline;margin-right:8px}}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.calhead h2{margin-right:auto;min-width:0}
.calhead .nav{display:inline-flex;border:1px solid var(--line-strong)}
.calhead .nav button{background:none;border:0;padding:8px 12px;color:var(--fg);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.calhead .nav button+button{border-left:1px solid var(--line-strong)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.mgrid .wd{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--tan);padding:8px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mcell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:grid;grid-template-rows:auto 1fr;gap:4px;background:none;text-align:left;color:var(--fg);min-width:0;cursor:pointer;transition:background .15s}
.mcell:hover{background:var(--raise)}
.mcell.out{color:var(--muted);opacity:.55}
.mcell.sel{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong)}
.mcell .dn{font-size:13px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.mcell.today .dn b{font-weight:500;background:var(--fg);color:var(--bg);width:22px;height:22px;display:inline-grid;place-items:center}
.mcell .dn b{font-weight:300}
.mcell .dn i{font-style:normal;font-size:10px;color:var(--tan)}
.mcell .evs{display:grid;gap:2px;align-content:start;min-width:0}
.mcell .mev{font-size:11px;line-height:1.3;padding:2px 5px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--raise)}
.mcell .more{font-size:10px;color:var(--muted);padding-left:5px}
.mcell .dots{display:none;gap:3px;flex-wrap:wrap;align-content:start}
.mcell .dots i{width:6px;height:6px;display:block}
@media (max-width:720px){
  .mgrid .wd{padding:6px 2px;text-align:center;font-size:9px}
  .mcell{min-height:58px;padding:5px 4px;gap:5px}
  .mcell .dn{justify-content:center}.mcell .dn i{display:none}
  .mcell .evs{display:none}.mcell .dots{display:flex;justify-content:center}
}
.wgrid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.wgrid .wd{padding:8px 4px;font-size:11px;border-bottom:1px solid var(--line-strong);border-left:1px solid var(--line);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wgrid .wd b{display:block;font-weight:300;font-size:20px;letter-spacing:-.3px;line-height:1.1}
.wgrid .wd.today b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.wgrid .wd small{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.wgrid .gut{position:relative;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.wgrid .gut span{position:absolute;right:6px;transform:translateY(-50%)}
.wgrid .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);min-width:0;cursor:pointer}
.wgrid .col.today{background-color:rgba(var(--line-rgb),.03)}
.wev{position:absolute;left:2px;right:2px;border-left:3px solid;background:var(--raise);padding:3px 5px;font-size:11px;line-height:1.25;overflow:hidden;text-align:left;color:var(--fg);cursor:pointer;transition:filter .15s}
.wev:hover{filter:brightness(1.15)}
.wev b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wev span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wev.clash{outline:1px solid var(--warn)}
.nowline{position:absolute;left:0;right:0;height:1px;background:var(--warn);z-index:2;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px;background:var(--warn)}
.wk-wrap{overflow-x:auto}
.wk-wrap .wgrid{min-width:640px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.agenda{margin-top:16px}
.ini{display:inline-flex;gap:2px}
.ini i{font-style:normal;font-size:9px;font-weight:500;width:16px;height:16px;display:inline-grid;place-items:center;border:1px solid var(--line-strong);color:var(--muted)}
.syncdot{width:8px;height:8px;display:inline-block;background:var(--muted);opacity:.5}
.syncdot.ok{background:var(--ok);opacity:1}.syncdot.syncing{background:var(--sand);animation:p 1s infinite}.syncdot.error{background:var(--danger);opacity:1}.syncdot.offline{background:var(--warn);opacity:1}
.locked .top,.locked nav.tabs,.locked .livebar{display:none!important}
.avail{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ad{background:var(--bg);border:1px solid var(--line);padding:6px 2px;display:grid;justify-items:center;gap:3px;color:var(--fg);cursor:pointer;min-height:0}
.ad small{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.ad b{font-weight:300;font-size:15px;font-variant-numeric:tabular-nums}
.ad span{display:flex;gap:3px}.ad span i{width:7px;height:7px;display:block}.ad span i.free{background:none;border:1px solid var(--line-strong)}
.ad.we{opacity:.5}.ad.sel{border-color:var(--fg)}.ad:hover{border-color:var(--line-strong)}
.rbar{height:10px;background:var(--line);position:relative}.rbar i{display:block;height:100%;max-width:100%}
.swatches input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line-strong);background:none;cursor:pointer}
.swatches input[type=color]::-webkit-color-swatch-wrapper{padding:2px}.swatches input[type=color]::-webkit-color-swatch{border:0}
.pill.st-pencil{color:var(--warn);border-color:var(--warn);border-style:dashed}.pill.st-confirmed{color:var(--ok);border-color:var(--ok)}.pill.st-cancelled{color:var(--danger);border-color:var(--danger)}
.ev.dim,.mev.dim,.wev.dim{opacity:.35}
.tag{font-style:normal;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;margin-left:6px;border:1px solid currentColor}
.tag.shoot{background:var(--fg);color:var(--bg);border-color:var(--fg)}.tag.edit{color:var(--tan)}.tag.off{color:var(--muted)}
.mcell.is-shoot{box-shadow:inset 0 0 0 2px var(--fg)}.mcell.is-edit{background:var(--raise)}.mcell.is-off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.mcell .dn{flex-wrap:wrap;gap:4px}
.mcell .mev{border-left:0;background:var(--c);padding:3px 6px;font-weight:500}.mcell .mev.pencil{background:transparent;color:var(--fg)!important;border:1px dashed var(--c)}

<script>
(function(){
const PEOPLE = [{id:'samuel',def:'Samuel'},{id:'tamy',def:'Tamy'}];
const CATS = ['Filming','Editing','Pre-production','Meeting','Admin','Travel'];
const BILLABLE_DEFAULT = {Filming:true,Editing:true,'Pre-production':true,Meeting:false,Admin:false,Travel:false};
const COLOURS = ['#B4725A','#C49A4A','#6E86A0','#B07A8A','#8A6E9E','#A65E3E','#7C8C94','#C7B48A','#5E6E8C','#9C6B5A'];
const EVTYPES = ['Shoot','Edit','Meeting','Deadline','Unavailable','Other'];
const BUSY_TYPES={Shoot:1,Edit:1,Unavailable:1};
const DEFAULT_TERMS='A pencil holds the dates for you without obligation on either side. Once you confirm, the dates are yours and we turn other work away for them.\n\nMoving or cancelling a confirmed booking: free with more than 7 days\u2019 notice (one move per booking). Within 7 days, 50% of the fee is payable. Within 48 hours, the full fee is payable.\n\nFees are ex VAT and exclude travel and expenses, which are agreed in advance and itemised on the invoice. Payment is due within 30 days of invoice.\n\nWeather, access or illness on our side: we will offer the next available dates at no charge.';
const DEF_SETTINGS = {names:{samuel:'Samuel',tamy:'Tamy'},vatRate:20,prefix:'QM-',nextInvoice:1001,terms:30,accountCode:'200',monthlyGoal:0,weeklyHoursTarget:0,availPublish:true,availWeeks:12,availWeekends:false,availEmail:'hello@quietmedia.co.uk',availMinHours:3,senderName:'Samuel',replyEmail:'hello@quietmedia.co.uk',replyPhone:'',pencilDays:7,bookingTerms:DEFAULT_TERMS};

const S = {clients:{},crew:{},entries:{},invoices:{},events:{},settings:{...DEF_SETTINGS},
  view:'today',client:null,week:0,period:'month',draft:{},modal:null,live:false,writable:true,loaded:{},
  cal:{mode:matchMedia('(max-width:720px)').matches?'month':'week',cursor:Date.now(),sel:null}};
try{const cm=localStorage.getItem('qm-calmode');if(cm)S.cal.mode=cm}catch(e){}
try{S.person=localStorage.getItem('qm-person')||'samuel'}catch(e){S.person='samuel'}
try{const v=localStorage.getItem('qm-view'); if(v) S.view=v}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const gbp=(n,dp)=>'£'+(Number(n)||0).toLocaleString('en-GB',{minimumFractionDigits:dp??0,maximumFractionDigits:dp??0});
const gbp2=n=>gbp(n,2);
const hrs=h=>{h=Math.max(0,h||0);const m=Math.round(h*60);return Math.floor(m/60)+'h '+pad(m%60)+'m'};
const hdec=h=>(Math.round((h||0)*100)/100).toFixed(2);
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtTime=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtDate=(ms,o)=>new Date(ms).toLocaleDateString('en-GB',o||{day:'numeric',month:'short'});
const elapsed=ms=>{const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const startOfDay=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()};
const startOfWeek=(ms)=>{const d=new Date(startOfDay(ms));const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.getTime()};
const startOfMonth=ms=>{const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const name=p=>(S.settings.names&&S.settings.names[p])||PEOPLE.find(x=>x.id===p)?.def||p;
const client=id=>S.clients[id];
const colour=id=>client(id)?.colour||'#7C8C94';
const cname=id=>client(id)?.name||'No client';
const entryH=e=>(((e.end||Date.now())-e.start)/3.6e6);
const parseLocal=(date,time)=>{const [y,m,d]=date.split('-').map(Number);const [hh,mm]=(time||'00:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm).getTime()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const activeClients=()=>Object.values(S.clients).filter(c=>!c.archived).sort((a,b)=>a.name.localeCompare(b.name));

function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}

/* ---------- data layer: end-to-end encrypted, synced through a private GitHub repo ----------
   Every collection is one file, data/<col>.json, holding {v, iv, ct}: AES-GCM-256 ciphertext.
   The key comes from the shared passphrase via PBKDF2 (salt stored in plain text in meta.json).
   GitHub only ever sees ciphertext. Each device caches the ciphertext locally so the app opens offline. */
const COLS=['clients','crew','entries','invoices','events','settings'];
const DEAD={};            // tombstones per collection: {id: deletedAt}
const SHA={};             // last known file sha per collection
const DIRTY={};           // collections with unsaved local changes
const CFG_KEY='qm-cfg';
let KEY=null, cfg=null, pushTimer=null, pollTimer=null, pushing=false;
S.sync={state:'idle',last:0,err:''};

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encrypt(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(obj)));return {v:1,iv:b64(iv),ct:b64(ct)}}
async function decrypt(blob){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},KEY,unb64(blob.ct));return JSON.parse(dec.decode(pt))}

function loadCfg(){try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){cfg=null}return cfg}
function saveCfg(c){cfg=c;try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){}}
function cacheGet(col){try{return JSON.parse(localStorage.getItem('qm-cache-'+col)||'null')}catch(e){return null}}
function cacheSet(col,v){try{localStorage.setItem('qm-cache-'+col,JSON.stringify(v))}catch(e){}}

/* GitHub contents API */
const GH='https://api.github.com';
function ghHeaders(){return {Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function ghGet(path,etag){
  const h=ghHeaders();if(etag)h['If-None-Match']=etag;
  const r=await fetch(GH+'/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+path+'?ref=main&_='+Date.now(),{headers:h,cache:'no-store'});
  if(r.status===304)return {unchanged:true};
  if(r.status===404)return {missing:true};
  if(r.status===401||r.status===403)throw Object.assign(new Error('auth'),{code:'auth'});
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();
  return {sha:j.sha,etag:r.headers.get('etag'),json:JSON.parse(dec.decode(unb64(j.content.replace(/\n/g,''))))};
}
async function ghPut(path,obj,sha,message){
  const body={message,content:b64(enc.encode(JSON.stringify(obj))),branch:'main'};if(sha)body.sha=sha;
  const r=await fetch(GH+'/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+path,{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return {conflict:true};
  if(r.status===401||r.status===403)throw Object.assign(new Error('auth'),{code:'auth'});
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();return {sha:j.content.sha};
}

/* merge two collection files {docs, dead}: newest _u wins; tombstones beat older docs */
function mergeCol(a,b){
  const docs={},dead={};
  for(const src of [a,b]){if(!src)continue;
    for(const [id,d] of Object.entries(src.docs||{})){if(!docs[id]||(d._u||0)>(docs[id]._u||0))docs[id]=d}
    for(const [id,t] of Object.entries(src.dead||{})){if(!dead[id]||t>dead[id])dead[id]=t}}
  for(const id of Object.keys(dead)){if(docs[id]&&(docs[id]._u||0)<=dead[id])delete docs[id]}
  const cut=Date.now()-120*864e5;for(const id of Object.keys(dead)){if(dead[id]<cut)delete dead[id]}
  return {docs,dead};
}
function localFile(col){
  if(col==='settings')return {docs:{app:S.settings},dead:{}};
  const docs={};for(const [id,d] of Object.entries(S[col]))docs[id]={...d,id};
  return {docs,dead:DEAD[col]||{}};
}
function applyFile(col,f){
  DEAD[col]=f.dead||{};
  if(col==='settings'){S.settings={...DEF_SETTINGS,...(f.docs.app||{})};return}
  const o={};for(const [id,d] of Object.entries(f.docs||{}))o[id]={...d,id};S[col]=o;
}

async function pull(col,force){
  const c=cacheGet(col);
  const r=await ghGet('data/'+col+'.json',force?null:(c&&c.etag));
  if(r.unchanged)return false;
  if(r.missing){SHA[col]=null;return false}
  const remote=await decrypt(r.json);
  const merged=DIRTY[col]?mergeCol(remote,localFile(col)):remote;
  applyFile(col,merged);SHA[col]=r.sha;
  cacheSet(col,{etag:r.etag,sha:r.sha,blob:r.json});
  return true;
}
/* public availability: dates + free/busy only, written to the public site repo */
let availTimer=null;
function availabilityData(){
  const weeks=+S.settings.availWeeks||12;const t0=startOfDay(Date.now());const days={};
  for(let i=0;i<weeks*7;i++){const d=t0+i*DAYMS;const dd=new Date(d);const we=dd.getDay()===0||dd.getDay()===6;
    if(we&&!S.settings.availWeekends){days[dayKey(d)]='off';continue}
    const busyPeople=PEOPLE.filter(p=>busyOn(d,p.id).length).length;
    days[dayKey(d)]=busyPeople>=PEOPLE.length?'busy':busyPeople?'limited':'free'}
  return {updated:Date.now(),email:S.settings.availEmail||'',days};
}
async function publishAvailability(){
  if(!cfg||!KEY||S.settings.availPublish===false)return;
  const siteRepo=cfg.siteRepo||'quietmedia-hours';const path='availability.json';const data=availabilityData();
  try{
    const saved=cfg;cfg={...saved,repo:siteRepo};
    let sha=null;try{const r=await ghGet(path);if(!r.missing)sha=r.sha;if(r.json&&JSON.stringify(r.json.days)===JSON.stringify(data.days)&&r.json.email===data.email){cfg=saved;return}}catch(e){}
    const r=await ghPut(path,data,sha,'Update availability');cfg=saved;
    if(r.conflict){S.avail='conflict'}else{S.avail='ok';S.availAt=Date.now()}
  }catch(e){S.avail=e.code==='auth'?'noaccess':'error';if(cfg.repo!==(loadCfg()||{}).repo)cfg=loadCfg()}
}
function scheduleAvailability(){clearTimeout(availTimer);availTimer=setTimeout(publishAvailability,4000)}
async function push(col){
  for(let i=0;i<4;i++){
    const file=localFile(col);const blob=await encrypt(file);
    const r=await ghPut('data/'+col+'.json',blob,SHA[col],'Update '+col);
    if(!r.conflict){SHA[col]=r.sha;cacheSet(col,{etag:null,sha:r.sha,blob});delete DIRTY[col];if(col==='events'||col==='settings')scheduleAvailability();return}
    await pull(col,true); // merges remote into local, then retry
  }
  throw new Error('Could not save '+col+' after several attempts');
}
async function syncAll(){
  if(!KEY||!cfg||pushing)return;pushing=true;S.sync.state='syncing';renderSyncDot();
  try{
    for(const col of COLS){if(DIRTY[col])await push(col);else await pull(col)}
    S.sync.state='ok';S.sync.last=Date.now();S.sync.err='';S.loaded.all=true;
  }catch(e){
    S.sync.state=navigator.onLine?'error':'offline';S.sync.err=e.code==='auth'?'GitHub rejected the token. Open Settings and enter a new one.':(e.message||'Sync failed');
  }
  pushing=false;renderSyncDot();render();
}
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(syncAll,700)}

/* write API used by the views */
function touch(col,id,data){S[col][id]={...data,id,_u:Date.now()};DIRTY[col]=true;cacheLocalFile(col);render();schedulePush();return id}
async function put(col,id,data){return touch(col,id||uid(),data)}
async function patch(col,id,data){return touch(col,id,{...S[col][id],...data})}
async function remove(col,id){delete S[col][id];(DEAD[col]=DEAD[col]||{})[id]=Date.now();DIRTY[col]=true;cacheLocalFile(col);render();schedulePush()}
async function saveSettings(data){S.settings={...S.settings,...data,_u:Date.now()};DIRTY.settings=true;cacheLocalFile('settings');render();schedulePush()}
async function cacheLocalFile(col){if(!KEY)return;try{const blob=await encrypt(localFile(col));const c=cacheGet(col)||{};cacheSet(col,{...c,blob,dirty:true})}catch(e){}}
function stripId(o){const c={...o};delete c.id;return c}
function banner(msg,cls){$('#banner').innerHTML=msg?'<div class="banner '+(cls||'')+'">'+msg+'</div>':''}
function renderSyncDot(){const el=$('#syncDot');if(!el)return;const s=S.sync.state;el.className='syncdot '+s;el.title=s==='ok'?'Synced '+fmtTime(S.sync.last):s==='syncing'?'Syncing':s==='offline'?'Offline, changes saved on this device':S.sync.err||s}

/* unlock: derive key, verify against meta.json, load cache, then sync */
async function unlock(c){
  cfg=c;
  let meta;
  try{const r=await ghGet('meta.json');if(r.missing){meta=null}else meta=r.json}
  catch(e){ if(e.code==='auth')throw new Error('GitHub rejected that token. Check it has Contents read and write on '+c.repo+'.'); const m=cacheGet('meta');if(!m)throw new Error('Could not reach GitHub, and nothing is cached on this device yet. Connect to the internet for first setup.');meta=m }
  if(!meta){
    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));KEY=await deriveKey(c.pass,salt);
    meta={v:1,kdf:'PBKDF2-SHA256-310000',salt,check:await encrypt({ok:true}),created:Date.now()};
    await ghPut('meta.json',meta,null,'Initialise Quiet Media Hours');
  }else{
    KEY=await deriveKey(c.pass,meta.salt);
    try{await decrypt(meta.check)}catch(e){KEY=null;throw new Error('That passphrase is not the one this data was set up with.')}
  }
  cacheSet('meta',meta);saveCfg(c);S.locked=false;
  for(const col of COLS){const cc=cacheGet(col);if(cc&&cc.blob){try{applyFile(col,await decrypt(cc.blob));SHA[col]=cc.sha;if(cc.dirty)DIRTY[col]=true}catch(e){}}}
  render();await syncAll();
  clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==='visible')syncAll()},30000);
}
function lockDevice(){KEY=null;S.locked=true;if(cfg){saveCfg({...cfg,pass:''})}clearInterval(pollTimer);render()}
function signOut(){KEY=null;S.locked=true;clearInterval(pollTimer);try{localStorage.removeItem(CFG_KEY);COLS.concat(['meta']).forEach(c=>localStorage.removeItem('qm-cache-'+c))}catch(e){}COLS.forEach(c=>{if(c!=='settings')S[c]={}});S.settings={...DEF_SETTINGS};render()}

async function boot(){
  S.locked=true;render();
  if(!window.isSecureContext||!crypto.subtle){banner('This page must be opened over https for encryption to work.','warn');return}
  const c=loadCfg();
  if(c&&c.token&&c.pass){try{await unlock(c)}catch(e){S.locked=true;S.unlockErr=e.message;render()}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncAll()});
  window.addEventListener('online',syncAll);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});let had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('App updated')})}
}

/* native downloads */
async function download(filename,data){
  const blob=new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function importBackup(file){
  const txt=await file.text();let j;try{j=JSON.parse(txt)}catch(e){toast('That file is not a backup from this app.');return}
  let n=0;
  for(const col of ['clients','entries','events','invoices']){for(const [id,d] of Object.entries(j[col]||{})){if(!S[col][id]){S[col][id]={...d,id,_u:d._u||Date.now()};n++}}DIRTY[col]=true}
  if(j.settings){S.settings={...DEF_SETTINGS,...j.settings,_u:Date.now()};DIRTY.settings=true}
  render();await syncAll();toast('Imported '+n+' records');
}

/* ---------- valuation ---------- */
function rateCard(c){return {billing:c.billing||'card',shortRate:+c.shortRate||0,halfDay:+c.halfDay||0,fullDay:+c.fullDay||0,editDay:+c.editDay||0,editHours:+c.editHours||8,hourlyRate:+c.hourlyRate||0,monthlyFee:+c.monthlyFee||0,retainerDays:+c.retainerDays||0,retainerDayHours:+c.retainerDayHours||8,retainerStart:c.retainerStart||''}}
function filmBand(h,r){if(h<=0)return null;if(h<=2)return['up to 2 hrs',r.shortRate];if(h<=4)return['half day',r.halfDay];return['full day',r.fullDay]}
/* The fee lives on the booking. The rate card only SUGGESTS a fee when a booking is created; once saved, the fee is fixed. */
function suggestFee(ev){
  const c=client(ev.clientId);if(!c)return 0;const r=rateCard(c);
  if(r.billing==='retainer')return 0;
  const h=(ev.end-ev.start)/3.6e6;
  if(ev.type==='Shoot'){if(r.billing==='hourly')return Math.round(h*r.hourlyRate);const b=filmBand(h,r);return b?b[1]:0}
  if(ev.type==='Edit'){if(r.billing==='hourly')return Math.round(h*r.hourlyRate);return r.editDay*Math.max(1,Math.ceil(h/r.editHours-1e-9))}
  return 0;
}
function eventValue(ev){return ev.fee!=null&&ev.fee!==''?+ev.fee||0:suggestFee(ev)}
const linesTotal=ls=>ls.reduce((s,l)=>s+l.qty*l.unit,0);
/* Bookings that have happened, carry a fee, and are not yet on an invoice */
function billableBookings(cid){const now=Date.now();return Object.values(S.events).filter(e=>e.clientId===cid&&!e.invoiceId&&e.status!=='cancelled'&&e.status!=='pencil'&&e.start<=now&&eventValue(e)>0).sort((a,b)=>a.start-b.start)}
function bookingLine(e){return {desc:e.title+' ('+fmtDate(e.start,{day:'numeric',month:'short'})+(e.type?', '+e.type.toLowerCase():'')+')',qty:1,unit:eventValue(e),eventId:e.id}}
/* Retainer months: 'YYYY-MM' keys from the retainer start month to the current month */
const monthKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthLabel=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
const monthRange=k=>{const [y,m]=k.split('-').map(Number);return [new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime()]};
function retainerMonths(c,upto){
  const r=rateCard(c);if(r.billing!=='retainer')return [];
  let start=r.retainerStart||monthKey(c.created||Date.now());const end=monthKey(upto||Date.now());const out=[];
  let [y,m]=start.split('-').map(Number);let guard=0;
  while(guard++<240){const k=y+'-'+pad(m);if(k>end)break;out.push(k);m++;if(m>12){m=1;y++}}
  return out;
}
function retainerDelivery(c,k){
  const r=rateCard(c);const [a,b]=monthRange(k);
  const es=Object.values(S.entries).filter(e=>e.clientId===c.id&&e.start>=a&&e.start<b);
  const hours=es.reduce((s,e)=>s+entryH(e),0);const promised=r.retainerDays*r.retainerDayHours;
  const byPerson={},byCat={};es.forEach(e=>{byPerson[e.person]=(byPerson[e.person]||0)+entryH(e);byCat[e.category]=(byCat[e.category]||0)+entryH(e)});
  return {key:k,hours,promised,days:r.retainerDayHours?hours/r.retainerDayHours:0,pct:promised?hours/promised*100:0,byPerson,byCat,fee:r.monthlyFee};
}
function unbilled(cid){
  const c=client(cid);const li=lastInvoice(cid);const since=li?li.date:0;
  const bookings=billableBookings(cid);
  const lines=bookings.map(bookingLine);
  const r=rateCard(c);const retMonths=r.billing==='retainer'&&r.monthlyFee?retainerMonths(c).filter(k=>!(c.retainerInvoiced||{})[k]):[];
  retMonths.forEach(k=>lines.push({desc:'Retainer, '+monthLabel(k),qty:1,unit:r.monthlyFee,month:k}));
  const es=Object.values(S.entries).filter(e=>e.clientId===cid&&e.start>=since);
  const done=es.filter(e=>e.end);
  const hours=done.reduce((s,e)=>s+entryH(e),0);
  const billH=done.filter(e=>e.billable!==false).reduce((s,e)=>s+entryH(e),0);
  const byPerson={};done.forEach(e=>{byPerson[e.person]=(byPerson[e.person]||0)+entryH(e)});
  return {bookings,retMonths,entries:es,done,lines,total:linesTotal(lines),hours,billH,byPerson,since};
}
/* Client value over a period: fees for bookings in the period vs hours logged in the period */
function clientValue(cid,from,to){
  const evs=Object.values(S.events).filter(e=>e.clientId===cid&&e.status!=='cancelled'&&e.start>=from&&e.start<to);
  let fees=evs.reduce((s,e)=>s+eventValue(e),0);
  const c=client(cid);if(c&&rateCard(c).billing==='retainer'){fees+=retainerMonths(c,to-1).filter(k=>monthRange(k)[0]>=startOfMonth(from)).length*rateCard(c).monthlyFee}
  const es=Object.values(S.entries).filter(e=>e.clientId===cid&&e.start>=from&&e.start<to);
  const hours=es.reduce((s,e)=>s+entryH(e),0);
  const byPerson={};es.forEach(e=>{byPerson[e.person]=(byPerson[e.person]||0)+entryH(e)});
  return {fees,hours,rate:hours?fees/hours:0,bookings:evs.length,byPerson};
}
function lastInvoice(cid){return Object.values(S.invoices).filter(i=>i.clientId===cid).sort((a,b)=>b.date-a.date)[0]}
function running(p){return Object.values(S.entries).find(e=>e.person===p&&!e.end)}

/* ---------- actions ---------- */
async function startTimer(){
  if(!S.writable)return;
  const d=S.draft;const cid=d.clientId||activeClients()[0]?.id;
  if(!cid){openClientModal();return}
  const cat=d.category||'Filming';
  const prev=running(S.person);
  if(prev) await patch('entries',prev.id,{end:Date.now()});
  await put('entries',null,{person:S.person,clientId:cid,category:cat,task:(d.task||'').trim(),start:Date.now(),end:null,billable:BILLABLE_DEFAULT[cat]!==false,created:Date.now()});
  S.draft.task='';render();toast('Clocked in for '+cname(cid));
}
async function stopTimer(p){const e=running(p);if(!e)return;await patch('entries',e.id,{end:Date.now()});toast('Clocked out. '+hrs(entryH({...e,end:Date.now()}))+' logged to '+cname(e.clientId))}

async function createInvoice(cid){
  const c=client(cid);const u=unbilled(cid);
  if(!u.lines.length)return;
  const num=(S.settings.prefix||'')+(S.settings.nextInvoice||1001);
  const sub=u.total;const vat=c.vat===false?0:sub*(+S.settings.vatRate||0)/100;
  const starts=u.bookings.map(e=>e.start).concat(u.retMonths.map(k=>monthRange(k)[0]));const ends=u.bookings.map(e=>e.end).concat(u.retMonths.map(k=>monthRange(k)[1]-1));const from=Math.min(...starts);const to=Math.max(...ends);
  const id=await put('invoices',null,{clientId:cid,number:num,date:Date.now(),from,to,lines:u.lines,subtotal:sub,vat,total:sub+vat,hours:u.hours,status:'draft',eventIds:u.bookings.map(e=>e.id),retMonths:u.retMonths});
  await saveSettings({nextInvoice:(+S.settings.nextInvoice||1001)+1});
  for(const e of u.bookings){await patch('events',e.id,{invoiceId:id})}
  if(u.retMonths.length){const ri={...(c.retainerInvoiced||{})};u.retMonths.forEach(k=>ri[k]=id);await patch('clients',cid,{retainerInvoiced:ri})}
  toast('Invoice '+num+' created with '+u.lines.length+' line'+(u.lines.length===1?'':'s')+'.');
}
async function undoInvoice(iid){
  const inv=S.invoices[iid];if(!inv)return;
  for(const eid of (inv.eventIds||[])){if(S.events[eid])await patch('events',eid,{invoiceId:null})}
  const c=client(inv.clientId);if(c&&(inv.retMonths||[]).length){const ri={...(c.retainerInvoiced||{})};inv.retMonths.forEach(k=>delete ri[k]);await patch('clients',inv.clientId,{retainerInvoiced:ri})}
  await remove('invoices',iid);S.modal=null;renderModal();toast('Invoice removed. Its bookings are back in "to invoice".');
}
function xeroCSV(invs){
  const head=['*ContactName','EmailAddress','*InvoiceNumber','Reference','*InvoiceDate','*DueDate','Description','*Quantity','*UnitAmount','*AccountCode','*TaxType','Currency'];
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const d=ms=>{const x=new Date(ms);return pad(x.getDate())+'/'+pad(x.getMonth()+1)+'/'+x.getFullYear()};
  const rows=[head.join(',')];
  invs.forEach(inv=>{const c=client(inv.clientId)||{};const due=inv.date+(+S.settings.terms||30)*864e5;
    (inv.lines||[]).forEach(l=>rows.push([c.name,c.email||'',inv.number,c.reference||'',d(inv.date),d(due),l.desc,l.qty,l.unit,S.settings.accountCode||'200',c.vat===false?'No VAT':'20% (VAT on Income)','GBP'].map(q).join(',')))});
  return rows.join('\n');
}
function icsFor(ev){
  const f=ms=>{const d=new Date(ms);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'};
  const e=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const who=(ev.people||[]).map(name).join(' & ');
  const desc=[cname(ev.clientId),ev.type,who&&('Crew: '+who),ev.notes].filter(Boolean).join('\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Quiet Media//Hours//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:qmh-'+ev.id+'@hours.quietmedia.co.uk','DTSTAMP:'+f(Date.now()),'DTSTART:'+f(ev.start),'DTEND:'+f(ev.end),'SUMMARY:'+e(ev.title),ev.location?'LOCATION:'+e(ev.location):'','DESCRIPTION:'+e(desc),'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
}
function addToAppleCalendar(ev){
  const blob=new Blob([icsFor(ev)],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){window.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000);return}
  const a=document.createElement('a');a.href=url;a.download=(ev.title||'booking').replace(/[^a-z0-9]+/gi,'-')+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
  toast('Calendar file saved. Open it to add the booking.');
}
function gcalLink(ev){
  const f=ms=>{const d=new Date(ms);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'};
  const who=(ev.people||[]).map(name).join(' & ');
  const details=[cname(ev.clientId),ev.type,who&&('Crew: '+who),ev.notes].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ev.title)+'&dates='+f(ev.start)+'/'+f(ev.end)+'&ctz=Europe/London&details='+encodeURIComponent(details)+(ev.location?'&location='+encodeURIComponent(ev.location):'');
}

const TABS=[['today','Today'],['schedule','Schedule'],['clients','Clients'],['invoicing','To invoice'],['insights','Insights'],['settings','Settings']];

let renderQueued=false;
function render(){ if(renderQueued)return; renderQueued=true; requestAnimationFrame(()=>{renderQueued=false;doRender()}) }
function doRender(){
  renderChrome();
  document.body.classList.toggle('locked',!!S.locked);if(S.locked){$('#view').innerHTML=vLock();renderLive();return}
  const v=S.view;let h='';
  if(v==='today')h=vToday();else if(v==='schedule')h=vSchedule();else if(v==='clients')h=S.client&&client(S.client)?vClient(S.client):vClients();
  else if(v==='invoicing')h=vInvoicing();else if(v==='insights')h=vInsights();else h=vSettings();
  const view=$('#view');const key=v+'|'+(S.client||'')+'|'+S.cal.mode;
  view.innerHTML=h; if(view.dataset.key!==key){view.classList.remove('fade');void view.offsetWidth;view.classList.add('fade');view.dataset.key=key}
  renderLive();
}
function renderLive(){
  let bar=$('#livebar');if(!bar){bar=document.createElement('div');bar.id='livebar';bar.className='livebar';document.body.appendChild(bar)}
  const r=running(S.person);const show=r&&S.view!=='today';
  bar.className='livebar'+(show?' on':'');
  if(show)bar.innerHTML='<span class="ldot"></span><span class="lt"><b data-since="'+r.start+'">'+elapsed(Date.now()-r.start)+'</b>'+esc(cname(r.clientId))+' · '+esc(r.category)+'</span><button data-act="stop" data-v="'+S.person+'">Clock out</button>';
}
function clientOptions(sel,withNone){

  return (withNone?'<option value="">No client</option>':'')+cs.map(c=>'<option value="'+c.id+'" '+(sel===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
}
function catOptions(sel){return CATS.map(c=>'<option '+(sel===c?'selected':'')+'>'+c+'</option>').join('')}

function vToday(){
  const now=Date.now();const d0=startOfDay(now);
  const cards=PEOPLE.map(p=>{
    const r=running(p.id);const mine=p.id===S.person;
    const todayH=Object.values(S.entries).filter(e=>e.person===p.id&&e.start>=d0).reduce((s,e)=>s+entryH(e),0);
    let body='';
    if(r){
      const long=(now-r.start)>10*3.6e6;
      body='<div class="chip"><span class="dot" style="background:'+colour(r.clientId)+'"></span>'+esc(cname(r.clientId))+' <span class="muted">· '+esc(r.category)+'</span></div>'+
      (r.task?'<div class="muted" style="font-size:14px">'+esc(r.task)+'</div>':'')+
      '<div class="big" data-since="'+r.start+'">'+elapsed(now-r.start)+'</div>'+

      '<div class="row" style="align-items:center"><button class="btn" data-act="stop" data-v="'+p.id+'" '+('')+'>Clock out</button><span class="note">Started '+fmtTime(r.start)+'</span></div>';
    }else if(mine){

      const seen={};const recent=Object.values(S.entries).filter(e=>e.person===p.id&&e.end&&client(e.clientId)&&!client(e.clientId).archived).sort((a,b)=>b.start-a.start).filter(e=>{const k=e.clientId+'|'+e.category;if(seen[k])return false;seen[k]=1;return true}).slice(0,4);
      const quick=recent.length?'<div><div class="eyebrow" style="margin-bottom:8px">One tap</div><div class="quick">'+recent.map(e=>'<button data-act="quick" data-c="'+e.clientId+'" data-k="'+esc(e.category)+'"><span class="dot" style="background:'+colour(e.clientId)+'"></span><span class="t">'+esc(cname(e.clientId))+'</span><span class="muted">'+esc(e.category)+'</span></button>').join('')+'</div></div>':'';
      body=cs.length?
      '<div class="big muted">00:00:00</div>'+quick+
      '<div class="row"><label class="f">Client<select id="d-client" data-draft="clientId">'+clientOptions(d.clientId||cs[0].id)+'</select></label>'+
      '<label class="f">Work<select id="d-cat" data-draft="category">'+catOptions(d.category||'Filming')+'</select></label></div>'+
      '<label class="f">What are you working on<input type="text" id="d-task" data-draft="task" placeholder="Edit first cut, location recce…" value="'+esc(d.task||'')+'"></label>'+
      '<div class="row" style="align-items:center"><button class="btn" data-act="start" '+('')+'>Clock in</button><button class="link" data-act="manual">Add time manually</button></div>'
      :'<div class="empty"><b>Add your first client</b> to start clocking time.<br><br><button class="btn" data-act="newclient">Add client</button></div>';
    }else{
      body='<div class="big muted">Not clocked in</div><div class="note">Switch to '+esc(name(p.id))+' at the top to clock in on this device.</div>';
    }
    return '<section class="panel clock'+(r?' running':'')+'"><div class="who"><div class="eyebrow">'+esc(name(p.id))+(mine?' · you':'')+'</div>'+(r?'<span class="pill live"><span class="pulse" style="background:var(--bg)"></span> Working</span>':'')+'</div>'+body+
    '<div class="note num">Today '+hrs(todayH)+'</div></section>';
  }).join('');

  const todays=Object.values(S.entries).filter(e=>e.start>=d0).sort((a,b)=>b.start-a.start);
  const list=todays.length?todays.map(entryRow).join(''):'<div class="empty">Nothing logged today yet. Clock in above, or add time you have already done.</div>';
  const up=Object.values(S.events).filter(e=>e.end>=now).sort((a,b)=>a.start-b.start).slice(0,5);
  const upl=up.length?up.map(e=>'<div class="item" style="cursor:pointer" data-act="gotoday" data-v="'+startOfDay(e.start)+'"><span class="sw" style="background:'+colour(e.clientId)+'"></span><div class="main"><div class="t">'+esc(e.title)+'</div><div class="meta">'+fmtDate(e.start,{weekday:'short',day:'numeric',month:'short'})+' · '+fmtTime(e.start)+'–'+fmtTime(e.end)+' · '+esc(cname(e.clientId))+'</div></div><div class="end"><span class="pill">'+esc(e.type)+'</span></div></div>').join(''):'<div class="empty">No upcoming work booked. <button class="link" data-act="newevent">Schedule something</button></div>';
  const toInv=activeClients().reduce((s,c)=>s+unbilled(c.id).total,0);const nToInv=activeClients().reduce((s,c)=>s+unbilled(c.id).lines.length,0);

  '<div class="grid g2" style="margin-top:16px"><section class="panel"><div class="panel-head"><h3>Logged today</h3><button class="link" data-act="manual">Add time</button></div><div class="list">'+list+'</div></section>'+
  '<section class="panel"><div class="panel-head"><h3>Coming up</h3><button class="link" data-act="nav" data-v="schedule">Schedule</button></div><div class="list">'+upl+'</div></section></div>';
}

  const inv=e.invoiceId&&S.invoices[e.invoiceId];
  return '<div class="item"><span class="sw" style="background:'+colour(e.clientId)+'"></span><div class="main"><div class="t">'+esc(cname(e.clientId))+' <span class="muted">· '+esc(e.category)+'</span></div><div class="meta">'+esc(name(e.person))+' · '+fmtDate(e.start)+' '+fmtTime(e.start)+'–'+(e.end?fmtTime(e.end):'now')+(e.task?' · '+esc(e.task):'')+(e.billable===false?' · not billable':'')+'</div></div>'+

const DAYMS=864e5;
function addMonths(ms,n){const d=new Date(ms);d.setDate(1);d.setMonth(d.getMonth()+n);return d.getTime()}
function clashes(ev,all){return all.some(o=>o.id!==ev.id&&o.start<ev.end&&o.end>ev.start&&(o.people||[]).some(p=>(ev.people||[]).includes(p)))}
function retainerPanel(c){
  const r=rateCard(c);const months=retainerMonths(c).slice(-6).reverse();if(!months.length)return '';
  const cur=retainerDelivery(c,months[0]);const maxP=Math.max(1,...Object.values(cur.byPerson));
  const bar=(d)=>{const over=d.hours>d.promised&&d.promised;const w=d.promised?Math.min(100,d.hours/d.promised*100):0;return '<div class="rbar"><i style="width:'+w+'%;background:'+(over?'var(--warn)':c.colour)+'"></i></div>'};
  const status=!cur.promised?'Set promised days in the client\'s rates to track delivery.':cur.pct<60?'Under-delivering so far this month. Room to add value.':cur.pct<=110?'On track.':'Over-delivering. Worth a conversation if it keeps happening.';
  return '<section class="panel"><div class="panel-head"><h3>Retainer, '+monthLabel(cur.key)+'</h3><span class="eyebrow num">'+gbp(r.monthlyFee)+' / month</span></div>'+

function vInsights(){
  const now=Date.now();const per=S.period;const who=S.insWho||'all';
  const from=per==='week'?startOfWeek(now):per==='month'?startOfMonth(now):new Date(new Date().getFullYear(),0,1).getTime();
  const to=now+1;
  const es=Object.values(S.entries).filter(e=>e.start>=from&&(who==='all'||e.person===who));
  const tot=es.reduce((s,e)=>s+entryH(e),0);const bill=es.filter(e=>e.billable!==false).reduce((s,e)=>s+entryH(e),0);
  const byP={};es.forEach(e=>{byP[e.person]=(byP[e.person]||0)+entryH(e)});
  const maxP=Math.max(1,...Object.values(byP));
  const m0=startOfMonth(now);
  const invM=Object.values(S.invoices).filter(i=>i.date>=m0).reduce((s,i)=>s+i.subtotal,0);
  const unb=activeClients().reduce((s,c)=>s+unbilled(c.id).total,0);
  const monthEnd=new Date(new Date(now).getFullYear(),new Date(now).getMonth()+1,1).getTime();
  const evM=Object.values(S.events).filter(e=>e.start>=m0&&e.start<monthEnd&&e.status!=='cancelled');
  const bookedM=evM.filter(e=>e.start>=now).reduce((s,e)=>s+eventValue(e),0);
  const crewM=evM.reduce((s,e)=>s+crewCost(e),0);const pencilM=evM.filter(e=>evStatus(e)==='pencil').reduce((s,e)=>s+eventValue(e),0);
  const retM=activeClients().filter(c=>rateCard(c).billing==='retainer').reduce((s,c)=>s+rateCard(c).monthlyFee,0);
  const grossM=invM+unb+bookedM;
  const goal=+S.settings.monthlyGoal||0;
  const rows=activeClients().map(c=>{const cv=clientValue(c.id,from,to);if(who!=='all'){cv.hours=cv.byPerson[who]||0;cv.rate=cv.hours?cv.fees/cv.hours:0}return {c,...cv}}).filter(r=>r.hours>0||r.fees>0);
  const totFees=rows.reduce((s,r)=>s+r.fees,0);const totH=rows.reduce((s,r)=>s+r.hours,0);
  const ranked=rows.slice().sort((a,b)=>(b.rate||0)-(a.rate||0));
  const maxH=Math.max(1,...rows.map(r=>r.hours));
  const byHours=rows.slice().sort((a,b)=>b.hours-a.hours);
  const wk=+S.settings.weeklyHoursTarget||0;
  const tbl=ranked.length?'<div class="tbl"><table><thead><tr><th>Client</th><th class="r">Fees</th><th class="r">Hours</th><th class="r">£/hr</th><th class="r">Share of time</th><th class="r">Share of fees</th></tr></thead><tbody>'+ranked.map(r=>{const st=totH?r.hours/totH*100:0,sf=totFees?r.fees/totFees*100:0;const under=st-sf>10;
    return '<tr><td><button class="chip link" style="text-decoration:none;color:var(--fg)" data-act="openclient" data-v="'+r.c.id+'"><span class="dot" style="background:'+r.c.colour+'"></span>'+esc(r.c.name)+'</button></td><td class="r">'+gbp(r.fees)+'</td><td class="r">'+hrs(r.hours)+'</td><td class="r" style="font-weight:400">'+(r.hours&&r.fees?gbp(r.rate):'—')+'</td><td class="r">'+Math.round(st)+'%</td><td class="r"'+(under?' style="color:var(--warn)"':'')+'>'+Math.round(sf)+'%'+(under?' ↓':'')+'</td></tr>'}).join('')+'</tbody><tfoot><tr><td>All clients</td><td class="r">'+gbp(totFees)+'</td><td class="r">'+hrs(totH)+'</td><td class="r">'+(totH&&totFees?gbp(totFees/totH):'—')+'</td><td class="r">100%</td><td class="r">100%</td></tr></tfoot></table></div>':'<div class="empty">Book work with fees and log time against it, and this table shows what each client is worth per hour.</div>';
  return '<div class="panel-head"><h1>Insights</h1><div class="row" style="flex:0 1 auto;align-items:center"><div class="seg">'+[['all','Both']].concat(PEOPLE.map(p=>[p.id,name(p.id)])).map(([k,l])=>'<button data-act="inswho" data-v="'+k+'" aria-pressed="'+(who===k)+'">'+esc(l)+'</button>').join('')+'</div><div class="seg">'+[['week','This week'],['month','This month'],['year','This year']].map(([k,l])=>'<button data-act="period" data-v="'+k+'" aria-pressed="'+(per===k)+'">'+l+'</button>').join('')+'</div></div></div>'+
  '<section class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>'+new Date().toLocaleDateString('en-GB',{month:'long'})+' revenue</h3>'+(goal?'<span class="eyebrow num">Goal '+gbp(goal)+'</span>':'<button class="link" data-act="nav" data-v="settings">Set a monthly goal</button>')+'</div>'+
  '<div class="grid g3"><div class="stat"><span class="eyebrow">Invoiced</span><span class="v">'+gbp(invM)+'</span></div><div class="stat"><span class="eyebrow">Done, not yet invoiced</span><span class="v">'+gbp(unb)+'</span>'+(retM?'<span class="s">includes '+gbp(retM)+' retainers</span>':'')+'</div><div class="stat"><span class="eyebrow">Booked for rest of month</span><span class="v">'+gbp(bookedM)+'</span>'+(pencilM?'<span class="s">'+gbp(pencilM)+' of it still pencilled</span>':'')+'</div></div>'+
  '<div class="grid g3" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><div class="stat"><span class="eyebrow">Gross this month</span><span class="v">'+gbp(grossM)+'</span></div><div class="stat"><span class="eyebrow">Crew to pay</span><span class="v">'+gbp(crewM)+'</span></div><div class="stat"><span class="eyebrow">Net to Quiet Media</span><span class="v" style="font-weight:400">'+gbp(grossM-crewM)+'</span><span class="s">Before expenses, which go on the invoice</span></div></div>'+
  (goal?'<div class="goal" aria-label="Progress to goal"><u style="width:'+Math.min(100,(invM+unb+bookedM)/goal*100)+'%"></u><i style="width:'+Math.min(100,invM/goal*100)+'%"></i></div><p class="note" style="margin-top:8px">'+Math.round(invM/goal*100)+'% invoiced. With work done and booked, '+Math.round((invM+unb+bookedM)/goal*100)+'% of the goal.</p>':'')+'</section>'+
  '<section class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Client value</h3><span class="note">Fees for bookings in the period against hours logged in it. A client taking a much bigger share of your time than of your fees is marked.</span></div>'+tbl+'</section>'+
  '<div class="grid g3" style="margin-bottom:16px"><div class="panel stat"><span class="eyebrow">Hours logged</span><span class="v">'+hrs(tot)+'</span>'+(wk&&per==='week'?'<span class="s">Target '+wk+' hrs each</span>':'')+'</div><div class="panel stat"><span class="eyebrow">On client work</span><span class="v">'+(tot?Math.round(bill/tot*100):0)+'%</span><span class="s">'+hrs(tot-bill)+' on admin, meetings and travel</span></div>'+
  '<div class="panel stat"><span class="eyebrow">Blended rate</span><span class="v">'+(tot&&totFees?gbp(totFees/tot):'—')+'<span class="muted" style="font-size:16px">/hr</span></span><span class="s">All fees over all hours, admin included</span></div></div>'+
  '<div class="grid g2"><section class="panel"><h3 style="margin-bottom:16px">Hours by person</h3><div class="bars">'+PEOPLE.map(p=>{const h=byP[p.id]||0;return '<div class="bar"><span class="lab">'+esc(name(p.id))+'</span><span class="track"><i style="width:'+(h/maxP*100)+'%;background:var(--sand)"></i></span><span class="val">'+hrs(h)+'</span></div>'}).join('')+'</div></section>'+
  '<section class="panel"><h3 style="margin-bottom:6px">Where the time goes</h3><p class="note" style="margin:0 0 14px">Darker segment '+esc(name('samuel'))+', lighter '+esc(name('tamy'))+'.</p><div class="bars">'+(byHours.length?byHours.map(r=>'<div class="bar"><span class="lab">'+esc(r.c.name)+'</span><span class="track">'+PEOPLE.map((p,i)=>'<i title="'+esc(name(p.id))+'" style="width:'+((r.byPerson[p.id]||0)/maxH*100)+'%;background:'+r.c.colour+';opacity:'+(i?0.5:1)+'"></i>').join('')+'</span><span class="val">'+hrs(r.hours)+'</span></div>').join(''):'<div class="empty">No hours logged in this period.</div>')+'</div></section></div>';
}

/* ===== crew, money and status helpers ===== */
const STATUS_LABEL={pencil:'Pencil',confirmed:'Confirmed',booked:'Confirmed',cancelled:'Cancelled'};
const evStatus=ev=>ev.status==='cancelled'?'cancelled':ev.status==='pencil'?'pencil':'confirmed';
const activeCrew=()=>Object.values(S.crew).filter(c=>!c.archived).sort((a,b)=>a.name.localeCompare(b.name));
const crewName=id=>(S.crew[id]||{}).name||'Crew';
function crewCost(ev){return (ev.crew||[]).filter(x=>x.status!=='declined').reduce((s,x)=>s+(+x.rate||0),0)}
function eventNet(ev){return eventValue(ev)-crewCost(ev)}
function contrast(hex){const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'');if(!m)return '#fff';const [r,g,b]=[1,2,3].map(i=>parseInt(m[i],16));return (r*299+g*587+b*114)/1000>150?'#0A0A0A':'#FFFFFF'}
function evInitials(ev){const ppl=(ev.people||[]).map(p=>'<i title="'+esc(name(p))+'">'+esc(name(p).slice(0,1))+'</i>');const cr=(ev.crew||[]).filter(x=>x.status!=='declined').map(x=>'<i class="cr" title="'+esc(crewName(x.id))+'">'+esc(crewName(x.id).slice(0,1))+'</i>');return '<span class="ini">'+ppl.concat(cr).join('')+'</span>'}
function dayTags(de){const live=de.filter(e=>e.status!=='cancelled');return {shoot:live.some(e=>e.type==='Shoot'),edit:live.some(e=>e.type==='Edit'),off:live.some(e=>e.type==='Unavailable'),pencil:live.some(e=>evStatus(e)==='pencil')}}
function tagHtml(t){return (t.shoot?'<em class="tag shoot">Filming</em>':'')+(t.edit?'<em class="tag edit">Edit</em>':'')+(t.off&&!t.shoot&&!t.edit?'<em class="tag off">Off</em>':'')}
function evVisible(ev){const w=S.cal.who;if(!w||w==='all')return true;return (ev.people||[]).includes(w)}
function groupOf(ev){return Object.values(S.events).filter(e=>ev.groupId?e.groupId===ev.groupId:e.id===ev.id).sort((a,b)=>a.start-b.start)}

/* ===== schedule ===== */
function vSchedule(){
  const C=S.cal;const all=Object.values(S.events);const t0=startOfDay(Date.now());
  let title,body,from,to;
  if(C.mode==='month'){
    const m0=startOfMonth(C.cursor);const d=new Date(m0);const g0=startOfWeek(m0);
    title=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    const cells=[];for(let i=0;i<42;i++)cells.push(g0+i*DAYMS);
    const last=cells[41]+DAYMS;from=g0;to=last;
    const need=cells.slice(35).some(x=>new Date(x).getMonth()===d.getMonth())?42:35;
    const evs=all.filter(e=>e.start<last&&e.end>=g0);
    const sel=C.sel||((t0>=m0&&t0<addMonths(m0,1))?t0:m0);
    body='<div class="mgrid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>'<div class="wd">'+w+'</div>').join('')+
    cells.slice(0,need).map(x=>{const de=evs.filter(e=>startOfDay(e.start)===x).sort((a,b)=>a.start-b.start);const dd=new Date(x);const out=dd.getMonth()!==d.getMonth();const val=de.filter(e=>e.status!=='cancelled').reduce((s,e)=>s+eventValue(e),0);const tg=dayTags(de.filter(evVisible));
      return '<button class="mcell'+(out?' out':'')+(x===t0?' today':'')+(x===sel?' sel':'')+(tg.shoot?' is-shoot':tg.edit?' is-edit':tg.off?' is-off':'')+'" data-act="selday" data-v="'+x+'"><span class="dn"><b>'+dd.getDate()+'</b>'+tagHtml(tg)+(val?'<i class="num">'+gbp(val)+'</i>':'')+'</span>'+
      '<span class="evs">'+de.slice(0,3).map(e=>'<span class="mev'+(evVisible(e)?'':' dim')+(evStatus(e)==='pencil'?' pencil':'')+'" style="--c:'+colour(e.clientId)+';color:'+contrast(colour(e.clientId))+'">'+esc(cname(e.clientId))+(e.title&&e.title!==cname(e.clientId)?' · '+esc(e.title):'')+'</span>').join('')+(de.length>3?'<span class="more">+'+(de.length-3)+' more</span>':'')+'</span>'+
      '<span class="dots">'+de.slice(0,6).map(e=>'<i style="background:'+colour(e.clientId)+(evVisible(e)?'':';opacity:.3')+'"></i>').join('')+'</span></button>'}).join('')+'</div>';
    const se=all.filter(e=>startOfDay(e.start)===sel).sort((a,b)=>a.start-b.start);
    body+='<section class="panel agenda"><div class="panel-head"><h3>'+new Date(sel).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'</h3><button class="btn small" data-act="newevent" data-v="'+dayKey(sel)+'">Add booking</button></div>'+(se.length?se.map(e=>evLine(e,all)).join(''):'<div class="empty">Nothing booked. Tap another day, or add a booking.</div>')+'</section>';
  } else if(C.mode==='week'){
    const w0=startOfWeek(C.cursor);from=w0;to=w0+7*DAYMS;
    const w6=w0+6*DAYMS;title=fmtDate(w0,{day:'numeric',month:'short'})+' – '+fmtDate(w6,{day:'numeric',month:'short',year:'numeric'});
    const evs=all.filter(e=>e.start<to&&e.end>=w0);
    const H0=7,H1=21,HH=44;const hours=[];for(let h=H0;h<=H1;h++)hours.push(h);
    const days=[];for(let i=0;i<7;i++)days.push(w0+i*DAYMS);
    const gut='<div class="gut" style="height:'+((H1-H0)*HH)+'px">'+hours.map((h,i)=>'<span style="top:'+(i*HH)+'px">'+pad(h)+'</span>').join('')+'</div>';
    const cols=days.map(x=>{
      const de=evs.filter(e=>startOfDay(e.start)===x).sort((a,b)=>a.start-b.start);
      const lanes=[];de.forEach(e=>{let i=0;while(lanes[i]&&lanes[i].some(o=>o.start<e.end&&o.end>e.start))i++;(lanes[i]=lanes[i]||[]).push(e);e._lane=i});
      const nl=Math.max(1,lanes.length);
      const blocks=de.map(e=>{const sh=(e.start-x)/3.6e6,eh=(e.end-x)/3.6e6;const top=Math.max(0,(sh-H0)*HH),h=Math.max(22,(Math.min(eh,H1)-Math.max(sh,H0))*HH);const w=100/nl;const col=colour(e.clientId);

function feeNote(){const n=document.getElementById('v-feenote');if(!n)return;const g=id=>(document.getElementById(id)||{}).value;const day=S.modal.days[0]||startOfDay(Date.now());let st=parseLocal(dayKey(day),g('v-start')||'09:00'),en=parseLocal(dayKey(day),g('v-end')||'17:00');if(en<=st)en=st+3600e3;const sug=suggestFee({clientId:g('v-client'),type:g('v-type'),start:st,end:en});const f=g('v-fee');

const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function sheetKeyFor(ev){if(ev.sheetKey)return ev.sheetKey;const k=b64url(crypto.getRandomValues(new Uint8Array(16)));await patch('events',ev.id,{sheetKey:k});return k}
async function encryptWith(keyB64url,obj){const raw=Uint8Array.from(atob(keyB64url.replace(/-/g,'+').replace(/_/g,'/')+'=='.slice(0,(4-keyB64url.length%4)%4)),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return {v:1,iv:b64(iv),ct:b64(ct)}}
function sheetPayload(ev,kind){
  const grp=groupOf(ev).filter(e=>e.status!=='cancelled');const c=client(ev.clientId)||{};const s=S.settings;
  const days=grp.map(e=>({date:e.start,start:fmtTime(e.start),end:fmtTime(e.end),call:e.callTime||'',location:e.location||'',title:e.title,type:e.type}));
  const base={kind,title:ev.title,client:c.name||'',type:ev.type,days,location:ev.location||'',notes:ev.notes||'',from:s.senderName||'Quiet Media',replyEmail:s.replyEmail||s.availEmail||'',replyPhone:s.replyPhone||'',updated:Date.now()};
  if(kind==='crew'){base.crew=(ev.crew||[]).filter(x=>x.status!=='declined').map(x=>({name:crewName(x.id),role:(S.crew[x.id]||{}).role||''}));base.team=(ev.people||[]).map(name);return base}
  base.fee=grp.reduce((t,e)=>t+eventValue(e),0);base.vat=c.vat!==false;base.status=evStatus(ev);base.terms=s.bookingTerms||'';base.ref=ev.groupId||ev.id;return base;
}
async function publishSheet(ev,kind){
  const key=await sheetKeyFor(ev);const id=(ev.groupId||ev.id)+(kind==='crew'?'c':'k');
  const blob=await encryptWith(key,sheetPayload(ev,kind));
  const saved=cfg;cfg={...saved,repo:saved.siteRepo||'quietmedia-hours'};
  try{let sha=null;try{const r=await ghGet('p/'+id+'.json');if(!r.missing)sha=r.sha}catch(e){}const r=await ghPut('p/'+id+'.json',blob,sha,'Publish '+kind+' page');cfg=saved;if(r.conflict)throw new Error('conflict');}
  catch(e){cfg=saved;throw e}
  const url='https://hours.quietmedia.co.uk/p/#'+id+'.'+key;
  await patch('events',ev.id,kind==='crew'?{sheetAt:Date.now()}:{pencilSent:ev.pencilSent||Date.now(),clientPageAt:Date.now()});
  return url;
}
function smsLink(phone,body){return 'sms:'+(phone||'').replace(/\s+/g,'')+(/(iPhone|iPad|Mac)/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(body)}
function mailLink(to,subject,body){return 'mailto:'+encodeURIComponent(to||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function openSendModal(evid){
  const ev=S.events[evid];if(!ev)return;const grp=groupOf(ev);const c=client(ev.clientId);
  S.modal={type:'send',evid,html:()=>{const ev=S.events[evid];if(!ev)return '';const s=S.settings;const dates=grp.map(e=>fmtDate(e.start,{weekday:'short',day:'numeric',month:'short'})).join(', ');const st=evStatus(ev);
    const crewUrl=S.sheetUrls&&S.sheetUrls[evid+'c'];const clientUrl=S.sheetUrls&&S.sheetUrls[evid+'k'];
    const crewMsg=(x)=>'Hi '+crewName(x.id).split(' ')[0]+', '+(x.status==='confirmed'?'confirming':'pencilling')+' you for '+esc(ev.title)+' on '+dates+(ev.callTime?', call time '+ev.callTime:'')+'. Call sheet: '+(crewUrl||'[publish first]')+' – '+(s.senderName||'Samuel');
    const pencilAge=ev.pencilSent?Math.floor((Date.now()-ev.pencilSent)/DAYMS):null;
    const clientBody=(reminder)=>(reminder?'Hi, a quick nudge on the dates we are holding for you: ':'Hi, we have pencilled the following dates for you: ')+dates+'. '+(ev.type==='Shoot'?'Filming':ev.type)+(ev.location?' at '+ev.location:'')+'. Everything is on your booking page, including how to confirm: '+(clientUrl||'[publish first]')+'\n\nBest,\n'+(s.senderName||'Samuel')+'\nQuiet Media';
    return '<h2>Send</h2><p class="note">'+esc(ev.title)+' · '+dates+'</p>'+
    '<section class="panel" style="padding:16px"><div class="panel-head"><h3 class="small">Crew call sheet</h3><button class="btn ghost small" data-act="pubsheet" data-v="'+evid+'" data-k="crew">'+(crewUrl?'Update page':'Publish page')+'</button></div>'+
    (crewUrl?'<div class="linkbox"><span>'+esc(crewUrl)+'</span><button class="link" data-act="copy" data-v="'+esc(crewUrl)+'">Copy</button></div>':'<p class="note">Publish to get a private link. It carries the key, so only people you send it to can read it. The page is live about a minute after publishing.</p>')+
    ((ev.crew||[]).length?'<div class="list" style="margin-top:10px">'+(ev.crew||[]).map(x=>{const cr=S.crew[x.id]||{};return '<div class="item"><span class="sw" style="background:var(--line-strong)"></span><div class="main"><div class="t">'+esc(cr.name||'Crew')+' <span class="muted">· '+esc(cr.role||'')+' · '+gbp(x.rate)+'</span></div><div class="meta">'+(cr.phone?'<a class="link" href="'+smsLink(cr.phone,crewMsg(x))+'">Text</a> · ':'')+(cr.email?'<a class="link" href="'+mailLink(cr.email,'Call sheet: '+ev.title+' '+dates,crewMsg(x))+'">Email</a>':'')+(!cr.phone&&!cr.email?'No contact details':'')+'</div></div><div class="end"><select data-act="crewstatus" data-e="'+evid+'" data-c="'+x.id+'"><option value="pencil" '+(x.status==='pencil'||!x.status?'selected':'')+'>Pencil</option><option value="confirmed" '+(x.status==='confirmed'?'selected':'')+'>Confirmed</option><option value="declined" '+(x.status==='declined'?'selected':'')+'>Declined</option></select></div></div>'}).join('')+'</div>':'<p class="note">No crew on this booking.</p>')+'</section>'+
    (c?'<section class="panel" style="padding:16px"><div class="panel-head"><h3 class="small">Client booking page</h3><button class="btn ghost small" data-act="pubsheet" data-v="'+evid+'" data-k="client">'+(clientUrl?'Update page':'Publish page')+'</button></div>'+
    (clientUrl?'<div class="linkbox"><span>'+esc(clientUrl)+'</span><button class="link" data-act="copy" data-v="'+esc(clientUrl)+'">Copy</button></div>':'<p class="note">The client sees the dates, fee, your terms, and Confirm / Ask to change buttons.</p>')+
    '<div class="row" style="margin-top:10px;align-items:center"><a class="btn small'+(clientUrl?'':' ghost')+'" href="'+mailLink(c.email||'',(st==='pencil'?'Pencilled: ':'Booking confirmed: ')+ev.title+' · '+dates,clientBody(false))+'">Email '+(st==='pencil'?'pencil':'confirmation')+'</a>'+(st==='pencil'&&pencilAge!=null?'<a class="btn ghost small" href="'+mailLink(c.email||'','Reminder: dates held for you · '+dates,clientBody(true))+'">Send reminder</a><span class="note">Pencilled '+pencilAge+' day'+(pencilAge===1?'':'s')+' ago'+(pencilAge>=(+s.pencilDays||7)?', <b style="color:var(--warn)">waiting too long</b>':'')+'</span>':'')+'</div>'+
    '<div class="row" style="margin-top:12px;align-items:center"><div class="seg">'+['pencil','confirmed','cancelled'].map(k=>'<button data-act="evstatus" data-v="'+k+'" data-e="'+evid+'" aria-pressed="'+(st===k)+'">'+STATUS_LABEL[k]+'</button>').join('')+'</div><span class="note">'+(grp.length>1?'Applies to all '+grp.length+' days.':'')+'</span></div>'+
    (!c.email?'<p class="note" style="color:var(--warn)">Add an accounts/contact email to the client to pre-address the message.</p>':'')+'</section>':'')+
    '<div class="acts"><button class="btn" data-act="closemodal">Done</button></div>'}};
  renderModal();
}
function pencilsPanel(){
  const now=Date.now();const seen={};const list=Object.values(S.events).filter(e=>evStatus(e)==='pencil'&&e.start>=startOfDay(now)&&e.clientId).sort((a,b)=>a.start-b.start).filter(e=>{const k=e.groupId||e.id;if(seen[k])return false;seen[k]=1;return true});
  if(!list.length)return '';
  return '<section class="panel"><div class="panel-head"><h3>Pencils waiting</h3><span class="note">'+list.length+' to confirm</span></div><div class="list">'+list.map(e=>{const age=e.pencilSent?Math.floor((now-e.pencilSent)/DAYMS):null;const late=age!=null&&age>=(+S.settings.pencilDays||7);return '<div class="item"><span class="sw" style="background:'+colour(e.clientId)+'"></span><div class="main"><div class="t">'+esc(cname(e.clientId))+' <span class="muted">· '+esc(e.title)+'</span></div><div class="meta">'+groupOf(e).map(x=>fmtDate(x.start,{day:'numeric',month:'short'})).join(', ')+' · '+(age==null?'not sent yet':'sent '+age+' day'+(age===1?'':'s')+' ago')+'</div></div><div class="end"><button class="btn ghost small'+(late?' danger':'')+'" data-act="sendsheet" data-v="'+e.id+'">'+(age==null?'Send pencil':late?'Chase':'Open')+'</button></div></div>'}).join('')+'</div></section>';
}
